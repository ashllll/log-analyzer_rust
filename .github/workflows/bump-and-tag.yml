name: Bump Version and Tag

permissions:
  contents: read

on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    branches: [main]
    types: [completed]

# Every successful main commit gets a release. Serialize version allocation so two
# completed CI runs can never claim the same patch version.
concurrency:
  group: continuous-release-train
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  tag:
    name: Allocate Version and Tag Validated SHA
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch release tags
        run: git fetch origin --force --tags

      - name: Allocate next patch version
        id: version
        run: node scripts/prepare-release.mjs plan

      - name: Tag the exact CI-validated commit
        id: publish
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to retarget an immutable release tag"
            exit 1
          fi

          git tag -a "${TAG}" "${HEAD_SHA}" -m "Continuous release ${TAG} from ${HEAD_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          gh workflow run release.yml \
            --ref "${TAG}" \
            -f "tag=${TAG}" \
            -f "prerelease=true"
